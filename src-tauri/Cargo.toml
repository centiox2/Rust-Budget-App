[package]
name = "verdant-budget"
version = "1.0.0"
edition = "2021"
[lib]
name = "verdant_budget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep device-testing APKs compact without embedding Rust debug symbols.
[profile.dev]
debug = 0
strip = "symbols"
opt-level = 1
