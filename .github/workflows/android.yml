name: Android APK
on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Rust checks
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Generate fresh Android project
        run: npm run tauri -- android init --ci
      - name: Build installable APK
        run: npm run tauri -- android build --debug --apk --target aarch64 armv7 --ci
      - name: Stage APK and checksum
        run: |
          mkdir -p artifacts
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk artifacts/Verdant-Budget-android.apk
          cd artifacts
          sha256sum Verdant-Budget-android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Verdant-Budget-Android
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
