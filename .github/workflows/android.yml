name: Kotlin Multiplatform Release
on:
  push:
    branches: [main, 'rebuild/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kotlin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    env:
      VERDANT_SIGNING_FILE: ${{ github.workspace }}/.signing/release.p12
      VERDANT_SIGNING_PASSWORD: ${{ secrets.VERDANT_SIGNING_PASSWORD }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Prepare private release keystore
        env:
          KEYSTORE: ${{ secrets.VERDANT_SIGNING_KEYSTORE }}
        run: |
          umask 077
          mkdir -p .signing
          printf '%s' "$KEYSTORE" | base64 --decode > "$VERDANT_SIGNING_FILE"
          test -s "$VERDANT_SIGNING_FILE"
      - run: chmod +x gradlew
      - name: Kotlin tests, UI renders, desktop compile, release lint, APK and bundle
        run: ./gradlew :shared:desktopTest :desktopApp:compileKotlin :androidApp:lintRelease :androidApp:assembleRelease :androidApp:bundleRelease :androidApp:assembleDebugAndroidTest :releaseDriver:assembleDebugAndroidTest --max-workers=2 --stacktrace
      - name: Verify release signature and stage artifacts
        run: |
          mkdir -p artifacts
          cp androidApp/build/outputs/apk/release/androidApp-release.apk artifacts/Verdant-Budget-Kotlin.apk
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab artifacts/Verdant-Budget-Kotlin.aab
          cp androidApp/build/outputs/mapping/release/mapping.txt artifacts/mapping.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/Verdant-Budget-Kotlin.apk
          keytool -exportcert -rfc -keystore "$VERDANT_SIGNING_FILE" -storepass:env VERDANT_SIGNING_PASSWORD -alias verdant -file artifacts/release-certificate.pem
          cd artifacts
          sha256sum Verdant-Budget-Kotlin.apk Verdant-Budget-Kotlin.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Verdant-Kotlin-Release
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Compose-UI-Previews
          path: build/ui-screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kotlin-Test-Reports
          path: |
            shared/build/reports/tests/
            androidApp/build/reports/lint-results-release.html
      - name: Remove temporary signing material
        if: always()
        run: rm -f .signing/release.p12
  android-ui:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/download-artifact@v4
        with:
          name: Verdant-Kotlin-Release
          path: artifacts/release
      - name: Verify downloaded production packages
        working-directory: artifacts/release
        run: sha256sum --check SHA256SUMS.txt
      - run: chmod +x gradlew
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/android-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-${{ matrix.api }}-UI-Results
          path: |
            androidApp/build/reports/androidTests/
            releaseDriver/build/reports/androidTests/
            artifacts/android-screenshots/
            artifacts/android-logcat.txt
