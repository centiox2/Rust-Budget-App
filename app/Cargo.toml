[package]
name = "budget-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Amara — a budgeting app for Android, written in Rust with egui"
publish = false

# cargo apk needs a cdylib, and panics if the package also produces a binary —
# that is why the desktop entry point lives in the sibling `desktop` crate.
[lib]
name = "budget_app"
crate-type = ["cdylib", "lib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
  "default_fonts",
  "glow",
  "android-native-activity",
  "x11",
  "wayland",
] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
winit = { version = "0.30", features = ["android-native-activity"] }

# Everything below here is what `cargo apk` reads to build the .apk.
[package.metadata.android]
package_name = "com.centiox2.budget"
apk_name = "amara-budget"
label = "Budget"
version_code = 1
version_name = "0.1.0"
build_targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35
